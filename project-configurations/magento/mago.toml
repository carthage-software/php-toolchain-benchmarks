php-version = "8.3"

[source]
paths = ["app", "dev", "phpserver", "setup", "pub"]
includes = ["vendor"]
excludes = []

[analyzer]
find-unused-expressions = true
find-unused-definitions = true
analyze-dead-code = true
check-throws = true
check-missing-override = true
find-unused-parameters = true
check-missing-type-hints = true
check-closure-missing-type-hints = true
check-arrow-function-missing-type-hints = true
enforce-class-finality = true
require-api-or-internal = true

[[guard.perimeter.restrictions]]
dependency = "Magento\\Setup\\**"
allow-from = ["Magento\\Setup\\", "Magento\\Framework\\Setup\\"]

[[guard.perimeter.restrictions]]
dependency = "Magento\\TestFramework\\**"
allow-from = ["Magento\\TestFramework\\", "Magento\\Test\\", "Magento\\**\\Test\\**"]

[[guard.perimeter.restrictions]]
dependency = "PHPUnit\\**"
allow-from = ["Magento\\TestFramework\\", "Magento\\Test\\", "Magento\\**\\Test\\**"]

[[guard.structural.rules]]
on = "Magento\\**\\Api\\Data\\**"
target = "interface"
must-be-named = "*Interface"
reason = "Service data contracts follow the *Interface naming convention."

[[guard.structural.rules]]
on = "Magento\\**\\Observer\\**"
target = "class"
must-implement = "Magento\\Framework\\Event\\ObserverInterface"
reason = "Event observers implement ObserverInterface."

[[guard.structural.rules]]
on = "Magento\\**\\Controller\\**"
target = "class"
must-implement = "Magento\\Framework\\App\\ActionInterface"
reason = "Controller actions implement ActionInterface."

[[guard.structural.rules]]
on = "Magento\\**\\Test\\Unit\\**"
target = "class"
must-be-named = "*Test"
must-extend = "PHPUnit\\Framework\\TestCase"
reason = "Unit tests follow the *Test naming convention and extend the PHPUnit test case."
