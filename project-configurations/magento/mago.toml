php-version = "8.3"

[source]
paths = ["app", "dev", "phpserver", "setup", "pub"]
includes = ["vendor"]
excludes = []

[analyzer]
find-unused-expressions = true
find-unused-definitions = true
analyze-dead-code = true
check-throws = true
check-missing-override = true
find-unused-parameters = true
check-missing-type-hints = true
check-closure-missing-type-hints = true
check-arrow-function-missing-type-hints = true
enforce-class-finality = true
require-api-or-internal = true

# Mirrors deptrac.yaml as far as namespaces allow (App: ~, Setup: [App], Dev: [App, Setup, Pub]).

# Setup code may only be used by Setup itself and by tests.
[[guard.perimeter.restrictions]]
dependency = "Magento\\Setup\\**"
allow-from = ["Magento\\Setup\\", "Magento\\**\\Test\\**", "Magento\\TestFramework\\"]

# Test framework code may only be used by tests.
[[guard.perimeter.restrictions]]
dependency = "Magento\\TestFramework\\**"
allow-from = ["Magento\\TestFramework\\", "Magento\\Test\\", "Magento\\**\\Test\\**"]
